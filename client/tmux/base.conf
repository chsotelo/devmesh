# devmesh tmux base — sourced from ~/.tmux.devmesh.conf (which sets @dm_name and the color).
set -g mouse on
set -g history-limit 50000
set -g window-size latest
setw -g aggressive-resize on
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -g status-interval 15

# Tabs (windows) named "folder:program", e.g. redi:claude. Rename: Ctrl+b ,
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}:#{pane_current_command}'

# Bar (monochrome, like the workspace): ● machine · session  tabs   connected devices.
# The machine's color (@dm_color) is only the dot; this overrides the older colored bar.
set -as terminal-features ",*:RGB"
set -g status-style "bg=#0f0f0f,fg=#6c6c6c"
set -g message-style "bg=#141414,fg=#e1e1e1"
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#6c6c6c"
set -g status-left-length 40
set -g status-left " #[fg=colour#{?@dm_color,#{@dm_color},250}]●#[fg=#e1e1e1,bold] #{@dm_name}#[nobold,fg=#6c6c6c] · #S   "
set -g status-right-length 40
set -g status-right "#[fg=#6c6c6c]#(dm _clients '#S' 2>/dev/null) "
set -g window-status-separator "  "
setw -g window-status-current-format "#[fg=#e1e1e1,bold]#W#[nobold]"
setw -g window-status-format "#[fg=#6c6c6c]#W"

# Terminal title: machine · session · program
set -g set-titles on
set -g set-titles-string "#{@dm_name} · #S · #{pane_current_command}"
