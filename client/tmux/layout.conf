# devmesh layout (on top of workspace.conf): the status bar is the machine selector, like
# the tabs of VS Code's bottom panel. Inactive tabs are gray, the active one is bright with
# the machine color; an off machine shows a ring. Buttons on the right use status ranges
# (tmux >= 3.2); keys: C-a + (new) · C-a x (delete) · C-a s (list) · C-a d (leave).
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=#0f0f0f,fg=#6c6c6c"
set -g status-left-length 14
set -g status-left "#{?#{e|<:#{client_width},70},,#[fg=#e1e1e1#,bold] devmesh #[nobold#,fg=#333333]│}"
set -g status-right-length 24
set -g status-right "#{?#{e|<:#{client_width},70},#[range=user|menu]#[bg=#1c1c1c]#[fg=#e1e1e1] ☰ #[norange]#[default] ,}#[range=user|add]#[bg=#1c1c1c]#[fg=#e1e1e1] + #[norange]#[default] #[range=user|delete]#[bg=#1c1c1c]#[fg=#e1e1e1] 🗑 #[norange]#[default] #[range=user|exit]#[bg=#1c1c1c]#[fg=#e1e1e1] ✕ #[norange]#[default]"
set -g window-status-separator ""
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-last-style default
set -g window-status-activity-style default
set -g window-status-format "#[fg=#6c6c6c] #{?@dm_offline,○ ,}#W "
set -g window-status-current-format "#[bg=#1c1c1c]#[fg=#ffffff,bold] #{?@dm_offline,#[fg=#6c6c6c]○,#[fg=colour#{@dm_color}]●}#[fg=#ffffff] #W #[default]"
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#333333"
set -g pane-border-status off
set -g remain-on-exit off
