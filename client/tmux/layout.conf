# devmesh layout (on top of workspace.conf): the status bar is the machine selector, like
# the tabs of VS Code's bottom panel, with Exit on the right. Its three lines (tall touch
# targets) are drawn by dm_ly_status_row in dm_layout.sh; status ranges need tmux >= 3.2.
# Keys: C-a + (new) · C-a x (delete) · C-a s (list) · C-a d (leave).
set -g status on
set -g status-position top
set -g status-style "bg=#0f0f0f,fg=#6c6c6c"
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#333333"
# A thin title above each pane, like VS Code: "TERMINALS" over the list, the open
# terminal's name over the terminal (hidden on phones, where the terminal is zoomed).
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-format "#{?#{==:#{@dm_role},side},#[fg=#6c6c6c] TERMINALS ,#{?#{@dm_shown},#[fg=#e1e1e1] >_ #{@dm_shown} ,}}"
set -g remain-on-exit off
# The workspace always takes the size of the screen that looks at it (the tablet, the Mac):
# built detached at 160x45, it must not stay wider than a smaller screen.
set -g window-size latest
setw -g aggressive-resize on
