# devmesh layout (on top of workspace.conf): the status bar is the machine selector, like
# the tabs of VS Code's bottom panel. Inactive tabs are gray, the active one is bright with
# the machine color; an off machine shows a ring. Buttons on the right use status ranges
# (tmux >= 3.2); keys: C-a + (new) · C-a x (delete) · C-a s (list) · C-a d (leave).
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=#0f0f0f,fg=#6c6c6c"
set -g status-left-length 14
set -g status-left "#{?#{e|<:#{client_width},70},,#[fg=#e1e1e1#,bold] devmesh #[nobold#,fg=#333333]│}"
set -g status-right-length 60
# Phones get symbols (Termux has no emoji font), wider screens the words.
set -g status-right "#{?#{e|<:#{client_width},70},#[range=user|menu]#[bg=#242424]#[fg=#e1e1e1] ☰ #[norange]#[default] #[range=user|exit]#[bg=#242424]#[fg=#e1e1e1] ✕ #[norange]#[default] ,#[range=user|exit]#[bg=#242424]#[fg=#e1e1e1] #{@dm_b_exit} #[norange]#[default] }"
set -g window-status-separator ""
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-last-style default
set -g window-status-activity-style default
# Narrow screens (phones): machine names are cut to 6 characters so every tab fits.
set -g window-status-format "#[fg=#6c6c6c] #{?@dm_self,⌂ ,#{?@dm_offline,○ ,}}#{?#{e|<:#{client_width},70},#{=6:window_name},#W} "
set -g window-status-current-format "#[bg=#1c1c1c]#[fg=#ffffff,bold] #{?@dm_self,#[fg=#7aa2f7]⌂,#{?@dm_offline,#[fg=#6c6c6c]○,#[fg=colour#{@dm_color}]●}}#[fg=#ffffff] #[underscore]#{?#{e|<:#{client_width},70},#{=6:window_name},#W}#[nounderscore] #[default]"
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#333333"
# A thin title above each pane, like VS Code: "TERMINALS" over the list, the open
# terminal's name over the terminal (hidden on phones, where the terminal is zoomed).
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-format "#{?#{==:#{@dm_role},side},#[fg=#6c6c6c] TERMINALS ,#{?#{@dm_shown},#[fg=#e1e1e1] >_ #{@dm_shown} ,}}"
set -g remain-on-exit off
# The workspace always takes the size of the screen that looks at it (the tablet, the Mac):
# built detached at 160x45, it must not stay wider than a smaller screen.
set -g window-size latest
setw -g aggressive-resize on
