# devmesh workspace: one screen on this device, a tab per remote terminal.
# Top bar = tabs (☰ panel, then one per terminal, dotted with the machine's color).
# Each tab shows the machine's own tmux bar at the bottom, so you always know where you are.
# Prefix is Ctrl+a here, so Ctrl+b keeps working inside the remote terminals.
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
set -g escape-time 10
set -g history-limit 20000
set -g default-terminal "tmux-256color"
set -g set-clipboard on
set -g renumber-windows on
set -g base-index 0
set -g focus-events on

set -as terminal-features ",*:RGB"
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#0f0f0f,fg=#6c6c6c"
set -g message-style "bg=#141414,fg=#e1e1e1"
set -g status-left "#[fg=#e1e1e1,bold] devmesh #[nobold,fg=#333333]│ "
set -g status-left-length 20
set -g status-right "#[fg=#505058]C-a p panel · C-a d detach "
set -g status-right-length 40
set -g window-status-separator ""
set -g window-status-format " #{?@dm_color,#[fg=colour#{@dm_color}]●#[fg=#6c6c6c] ,}#W "
set -g window-status-current-format "#[bg=#1c1c1c,fg=#ffffff,bold] #{?@dm_color,#[fg=colour#{@dm_color}]●#[fg=#ffffff] ,}#W #[default]"
set -g pane-border-status off

# Ctrl+a p (or the first tab): back to the panel.
bind p select-window -t :=panel
